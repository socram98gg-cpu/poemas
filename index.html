<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fragmentos del Edén · Galaxia Viva</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Wide Latin', 'Georgia', serif;
            color: white;
            background: black;
        }
        /* Fondo de estrellas real (imagen) */
        #fondo-estrellas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/bdfa9e57bce3979057b206779a585590490fd1c0/IMG_5593.JPG');
            background-size: cover;
            background-position: center;
            filter: brightness(0.5) contrast(1.3);
            transition: transform 0.1s ease, opacity 0.5s ease;
        }
        /* Canvas 3D */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        /* Contenedor de las páginas (SPA) */
        #pages {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            pointer-events: none;
        }
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }
        .page.active {
            display: block;
        }
        /* Botones superiores (siempre visibles) */
        #botonera {
            position: fixed;
            top: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 5%;
            box-sizing: border-box;
            z-index: 100;
            pointer-events: none;
        }
        .boton {
            pointer-events: auto;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 40px rgba(255,215,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 10px black;
            border: 2px solid rgba(255,255,200,0.8);
            transition: all 0.3s;
            cursor: pointer;
        }
        .boton:hover {
            transform: scale(1.1);
            box-shadow: 0 0 70px gold;
        }
        #btn1 { background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5467.jpeg'); }
        #btn2 { background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5468.jpeg'); }
        #btn3 { background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/f6f8d56b2cdc5ddce9d4a9dc423ee969f18d663e/IMG_5460.jpeg'); }
        .boton span {
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }
        /* Botón modo meditación */
        #modo-meditacion {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 200;
            pointer-events: auto;
            background: rgba(20,20,40,0.7);
            color: white;
            border: 1px solid cyan;
            border-radius: 40px;
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            font-family: 'Georgia', serif;
        }
        #modo-meditacion:hover {
            background: rgba(0,0,0,0.9);
            box-shadow: 0 0 30px cyan;
        }
        /* Contenido de cada página (textos) */
        .contenido-pagina {
            position: relative;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
            pointer-events: auto;
        }
        .contenido-pagina::-webkit-scrollbar {
            display: none;
        }
        .seccion {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10%;
            text-align: center;
        }
        .cita {
            font-size: 4rem;
            color: white;
            text-shadow: 2px 2px 0 #000, 0 0 40px #ffaa88, 0 0 80px #b266ff;
            line-height: 1.5;
            transition: opacity 0.5s;
        }
        .cita small {
            display: block;
            font-size: 1.8rem;
            color: #ffdd99;
            margin-top: 40px;
        }
        /* Página de poemitas (placeholder) */
      
        /* Efecto de transición */
        body.transition * {
            pointer-events: none !important;
        }
        @media (max-width: 800px) {
            .cita { font-size: 2.5rem; }
            .boton { width: 110px; height: 110px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div id="fondo-estrellas"></div>
    <div id="canvas-container"></div>

    <div id="botonera">
        <div class="boton" id="btn1"><span>Poemitas para ti</span></div>
        <div class="boton" id="btn2"><span>Prosa</span></div>
        <div class="boton" id="btn3"><span>Otros</span></div>
    </div>

    <button id="modo-meditacion">🌌 Modo Meditación</button>

    <!-- Sistema de páginas (SPA) -->
<div id="pages">
        <!-- Página de inicio (con textos de Job) -->
        <div class="page active" id="page-inicio">
            <div class="contenido-pagina" id="contenido-inicio">
                <section class="seccion"><div class="cita">¿Podrás tú atar los lazos de las Pléyades?</div></section>
                <section class="seccion"><div class="cita">¿Sacarás tú a su tiempo las constelaciones?</div></section>
                <section class="seccion"><div class="cita">¿Supiste tú las ordenanzas de los cielos?</div></section>
                <section class="seccion"><div class="cita">¿Dispondrás tú de su potestad?<br><small>Job 38:31-33</small></div></section>
            </div>
        </div> <!-- cierra page-inicio -->
    </div> <!-- cierra pages -->

    <!-- Scripts -->
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURACIÓN INICIAL ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null;

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 1, 2); // Ajustado: más cerca y ligeramente lateral
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- LUCES ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const coreLight = new THREE.PointLight(0xff8844, 2.0, 30);
        coreLight.position.set(0, 0, 0);
        scene.add(coreLight);

        // --- GENERACIÓN DE GALAXIA (16,000 ESTRELLAS) ---
        function createGalaxy() {
            const count = 16000;
            const arms = 8;
            const radius = 18;
            const spin = 2.2;
            const randomness = 0.65;
            const coreRadius = 3.5;

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorInside = new THREE.Color(0xff6633);
            const colorOutside = new THREE.Color(0x44aaff);

            for (let i = 0; i < count; i++) {
                const r = Math.pow(Math.random(), 1.2) * radius;
                const armAngle = (i % arms) * (Math.PI * 2 / arms);
                const spinAngle = r * spin;
                const randomAngle = (Math.random() - 0.5) * randomness * 1.5;
                const randomRadial = (Math.random() - 0.5) * 0.8;
                
                const angle = armAngle + spinAngle + randomAngle;
                
                const x = Math.cos(angle) * (r + randomRadial);
                const z = Math.sin(angle) * (r + randomRadial);
                const y = (Math.random() - 0.5) * 2.5 * (r / 10);

                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;

                const mixFactor = Math.max(0, Math.min(1, (r - coreRadius) / (radius - coreRadius)));
                const color = colorInside.clone().lerp(colorOutside, mixFactor);
                color.multiplyScalar(0.7 + 0.5 * Math.random());
                
                colors[i*3] = color.r;
                colors[i*3+1] = color.g;
                colors[i*3+2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.5, 'rgba(180,180,255,0.8)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.2,
                map: texture,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                sizeAttenuation: true
            });

            return new THREE.Points(geometry, material);
        }

        const galaxy = createGalaxy();
        scene.add(galaxy);

        // --- METEOROS ---
        const meteorGeo = new THREE.BufferGeometry();
        const meteorCount = 5;
        const meteorPositions = new Float32Array(meteorCount * 3);
        const meteorSpeeds = [];
        for (let i = 0; i < meteorCount; i++) {
            meteorPositions[i*3] = (Math.random() - 0.5) * 60;
            meteorPositions[i*3+1] = (Math.random() - 0.5) * 30;
            meteorPositions[i*3+2] = (Math.random() - 0.5) * 60 - 30;
            meteorSpeeds.push({
                x: (Math.random() - 0.5) * 0.5,
                y: (Math.random() - 0.5) * 0.5,
                z: Math.random() * 0.8 + 0.5
            });
        }
        meteorGeo.setAttribute('position', new THREE.BufferAttribute(meteorPositions, 3));
        
        const meteorCanvas = document.createElement('canvas');
        meteorCanvas.width = 16;
        meteorCanvas.height = 16;
        const mCtx = meteorCanvas.getContext('2d');
        mCtx.fillStyle = 'white';
        mCtx.beginPath();
        mCtx.arc(8, 8, 4, 0, 2*Math.PI);
        mCtx.fill();
        mCtx.fillStyle = 'orange';
        mCtx.beginPath();
        mCtx.arc(12, 8, 2, 0, 2*Math.PI);
        mCtx.fill();
        const meteorTexture = new THREE.CanvasTexture(meteorCanvas);
        
        const meteorMaterial = new THREE.PointsMaterial({
            size: 0.5,
            map: meteorTexture,
            color: 0xffaa66,
            blending: THREE.AdditiveBlending,
            transparent: true
        });
        const meteors = new THREE.Points(meteorGeo, meteorMaterial);
        scene.add(meteors);

        // --- CONTROL DE SCROLL (página de inicio) ---
        let targetCamPos = new THREE.Vector3(0, 0, 0);
const farPos = new THREE.Vector3(0, 0, 40);
const nearPos = new THREE.Vector3(0, 0, 0);
        
        const fondoDiv = document.getElementById('fondo-estrellas');
        const contenidoInicio = document.getElementById('contenido-inicio');
        
        function updateScroll() {
            if (!document.getElementById('page-inicio').classList.contains('active')) return;
            
            const scrollY = contenidoInicio.scrollTop;
            const maxScroll = contenidoInicio.scrollHeight - contenidoInicio.clientHeight;
            const progress = Math.min(1, scrollY / maxScroll);
            
            targetCamPos.x = nearPos.x + (farPos.x - nearPos.x) * progress;
            targetCamPos.y = nearPos.y + (farPos.y - nearPos.y) * progress;
            targetCamPos.z = nearPos.z + (farPos.z - nearPos.z) * progress;
            
            coreLight.intensity = 2.0 * (1 - progress * 0.7);
            
            if (fondoDiv) {
                fondoDiv.style.transform = `scale(${1 + progress * 0.4})`;
            }
        }
        
        contenidoInicio.addEventListener('scroll', updateScroll);

        // --- SISTEMA DE PÁGINAS ---
        const pages = {
    inicio: document.getElementById('page-inicio')
};
        
        let currentPage = 'inicio';
        
        function showPage(pageId) {
    // Solo mostramos/ocultamos la página de inicio (las otras son externas)
    if (pageId === 'inicio') {
        pages.inicio.classList.add('active');
        contenidoInicio.scrollTop = 0;
        targetCamPos.copy(nearPos);
    } else {
        // Si por algún motivo se llama a otra página, no hacemos nada
        console.warn('Página interna no disponible, se usa redirección externa');
    }
}

        // --- TRANSICIÓN CON HIPERESPACIO (MEJORADA) ---
        async function transitionToPage(pageId, passwordNeeded = false) {
    if (passwordNeeded) {
        const pwd = prompt('Contraseña para Poemitas:');
        if (pwd !== 'Laura') {  // Cambiado a mayúscula
            alert('Contraseña incorrecta');
            return;
        }
    }

    document.body.classList.add('transition');
    
    // 1. Obtener el botón y clonarlo para la animación
    const targetBtn = pageId === 'poemitas' ? btn1 : (pageId === 'prosa' ? btn2 : btn3);
    const btnRect = targetBtn.getBoundingClientRect();
    
    // Crear un elemento clon para la animación de zoom
    const zoomBtn = document.createElement('div');
    zoomBtn.style.position = 'fixed';
    zoomBtn.style.left = btnRect.left + 'px';
    zoomBtn.style.top = btnRect.top + 'px';
    zoomBtn.style.width = btnRect.width + 'px';
    zoomBtn.style.height = btnRect.height + 'px';
    zoomBtn.style.borderRadius = '50%';
    zoomBtn.style.backgroundImage = window.getComputedStyle(targetBtn).backgroundImage;
    zoomBtn.style.backgroundSize = 'cover';
    zoomBtn.style.backgroundPosition = 'center';
    zoomBtn.style.boxShadow = '0 0 50px gold';
    zoomBtn.style.zIndex = '1000';
    zoomBtn.style.transition = 'all 1s ease';
    document.body.appendChild(zoomBtn);
    
    // 2. Forzar un reflow para que la transición funcione
    zoomBtn.offsetHeight;
    
    // 3. Animar el zoom a pantalla completa
    zoomBtn.style.left = '0';
    zoomBtn.style.top = '0';
    zoomBtn.style.width = '100vw';
    zoomBtn.style.height = '100vh';
    zoomBtn.style.borderRadius = '0';
    zoomBtn.style.transform = 'scale(1)';
    
    // 4. Esperar a que termine la animación
    await new Promise(r => setTimeout(r, 1000));
    
    // 5. Redirigir a la página correspondiente
    if (pageId === 'poemitas') {
        window.location.href = 'poemitas.html';
    } else if (pageId === 'prosa') {
        window.location.href = 'prosa.html';
    } else if (pageId === 'otros') {
        window.location.href = 'otros.html';
    }
    
    // (Opcional: si usas SPA en lugar de redirección, mantén showPage)
    // showPage(pageId);
    // zoomBtn.remove();
    
    document.body.classList.remove('transition');
}
        
        // --- EVENTOS DE BOTONES ---
        document.getElementById('btn1').addEventListener('click', () => transitionToPage('poemitas', true));
        document.getElementById('btn2').addEventListener('click', () => transitionToPage('prosa', false));
        document.getElementById('btn3').addEventListener('click', () => transitionToPage('otros', false));

        // --- MODO MEDITACIÓN (CORREGIDO: OCULTA FONDO) ---
        let modoMeditacionActivo = false;
        let audio = null;
        
        document.getElementById('modo-meditacion').addEventListener('click', () => {
            modoMeditacionActivo = !modoMeditacionActivo;
            
            // Ocultar/mostrar textos
            document.querySelectorAll('.cita').forEach(el => {
                el.style.opacity = modoMeditacionActivo ? '0' : '1';
            });
            
            // Ocultar/mostrar fondo de estrellas
            const fondoEstrellas = document.getElementById('fondo-estrellas');
            fondoEstrellas.style.opacity = modoMeditacionActivo ? '0' : '1';
            
            // Atenuar luces
            ambientLight.intensity = modoMeditacionActivo ? 0.1 : 0.5;
            coreLight.intensity = modoMeditacionActivo ? 0.5 : 2.0;
            
            // Activar/desactivar música
            if (modoMeditacionActivo) {
                if (!audio) {
                    audio = new Audio();
                    audio.src = 'https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/Laura%20audio.mp3';
                    audio.loop = true;
                    audio.volume = 0.5;
                }
                audio.play().catch(e => console.log('Autoplay bloqueado:', e));
            } else {
                if (audio) audio.pause();
            }
        });

        // --- ANIMACIÓN PRINCIPAL ---
        let clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            camera.position.lerp(targetCamPos, 0.05);
            camera.lookAt(0, 1, 0);
            
            galaxy.rotation.y += 0.003;
            galaxy.rotation.x = 0.15;
            
            // Mover meteoros
            const positions = meteors.geometry.attributes.position.array;
            for (let i = 0; i < meteorCount; i++) {
                positions[i*3+2] += meteorSpeeds[i].z * delta * 20;
                if (positions[i*3+2] > 30) {
                    positions[i*3] = (Math.random() - 0.5) * 60;
                    positions[i*3+1] = (Math.random() - 0.5) * 30;
                    positions[i*3+2] = -30;
                }
            }
            meteors.geometry.attributes.position.needsUpdate = true;
            
            renderer.render(scene, camera);
        }
        
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        showPage('inicio');
    </script>
</body>
</html>
