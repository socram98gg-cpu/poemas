<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fragmentos del Edén</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0e0e0e;
      font-family: "Georgia", serif;
      color: #f5f1e8;
    }

    .portada {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Contenedor de imagen en proporción vertical */
    .imagen-fondo {
      position: absolute;
      width: 70vw;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("IMG_5264.jpeg");
      background-size: cover;
      background-position: center;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      z-index: -1;
    }

    .portada h1 {
      font-size: 72px;
      letter-spacing: 4px;
      margin: 0;
      font-weight: normal;
      color: #f8e7c9;
    }

    .frase {
      margin-top: 25px;
      font-size: 20px;
      font-style: italic;
      max-width: 320px;
      line-height: 1.6;
      color: #e6d8bd;
    }

    .menu {
      margin-top: 70px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu a {
      text-decoration: none;
      font-size: 20px;
      letter-spacing: 1px;
      color: #f5f1e8;
      padding: 12px 28px;
      border: 1px solid #c8b98f;
      border-radius: 30px;
      transition: all 0.4s ease;
      backdrop-filter: blur(4px);
    }

    .menu a:hover {
      background-color: #c8b98f;
      color: #111;
      transform: translateY(-3px);
    }

  </style>
</head>
<body>

<div class="portada">
  
  <div class="imagen-fondo"></div>

  <h1>Fragmentos del Edén</h1>

  <div class="frase">
    Adán: Dondequiera que ella estaba, allí era el Edén.
  </div>

  <div class="menu">
    <a href="poemitas.html">Poemitas para ti</a>
    <a href="prosa.html">Prosa</a>
    <a href="otros.html">Otros</a>
  </div>

</div>

</body>
</html>
