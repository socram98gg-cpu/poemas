<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fragmentos del Edén · Galaxia Espiral</title>
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            font-family: 'Wide Latin', 'Georgia', serif;
            color: #fff;
            background: #000;
        }

        /* Fondo de estrellas real */
        .fondo-estrellas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/bdfa9e57bce3979057b206779a585590490fd1c0/IMG_5593.JPG');
            background-size: cover;
            background-position: center;
            filter: brightness(0.5) contrast(1.4);
            transition: transform 0.1s ease;
        }

        /* Canvas 3D */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* Contenido */
        .content {
            position: relative;
            z-index: 20;
            pointer-events: none;
            min-height: 400vh;
        }

        /* Botones mejorados */
        .botonera {
            position: fixed;
            top: 30px;
            width: 100%;
            z-index: 50;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            padding: 0 5%;
            box-sizing: border-box;
        }

        .boton {
            pointer-events: auto;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 40px rgba(255,215,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 10px black;
            border: 2px solid rgba(255,255,200,0.7);
            transition: all 0.3s;
        }

        .boton:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px gold;
        }

        #btn1 { background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5467.jpeg'); }
        #btn2 { background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5468.jpeg'); }
        #btn3 { background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/f6f8d56b2cdc5ddce9d4a9dc423ee969f18d663e/IMG_5460.jpeg'); }

        .boton span {
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        /* Textos */
        .seccion {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10%;
            text-align: center;
        }

        .cita {
            font-size: 4rem;
            color: white;
            text-shadow: 2px 2px 0 #000, 0 0 30px #ffaa88, 0 0 60px #b266ff;
            line-height: 1.5;
        }

        .cita small {
            display: block;
            font-size: 1.8rem;
            color: #ffdd99;
            margin-top: 40px;
        }

        @media (max-width: 800px) {
            .cita { font-size: 2.5rem; }
            .boton { width: 110px; height: 110px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="fondo-estrellas" id="fondo"></div>
    <div id="canvas-container"></div>

    <div class="botonera">
        <a href="#" class="boton" id="btn1"><span>Poemitas</span></a>
        <a href="prosa.html" class="boton" id="btn2"><span>Prosa</span></a>
        <a href="otros.html" class="boton" id="btn3"><span>Otros</span></a>
    </div>

    <div class="content">
        <section class="seccion"><div class="cita">¿Podrás tú atar los lazos de las Pléyades?</div></section>
        <section class="seccion"><div class="cita">¿Sacarás tú a su tiempo las constelaciones?</div></section>
        <section class="seccion"><div class="cita">¿Supiste tú las ordenanzas de los cielos?</div></section>
        <section class="seccion"><div class="cita">¿Dispondrás tú de su potestad?<br><small>Job 38:31-33</small></div></section>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURACIÓN BÁSICA ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = null; // transparente

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 15); // Posición inicial que debería mostrar la galaxia
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- LUCES ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        
        const centerLight = new THREE.PointLight(0xffaa66, 1.5, 30);
        centerLight.position.set(0, 0, 0);
        scene.add(centerLight);

        // --- GENERADOR DE GALAXIA ESPIRAL (MÉTODO ROBUSTO) ---
        function createGalaxy() {
            const parameters = {
                count: 8000,
                arms: 8,
                radius: 15,
                spin: 2.5,
                randomness: 0.4,
                coreRadius: 3,
                insideColor: 0xffaa66,
                outsideColor: 0x88aaff
            };

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);

            const colorInside = new THREE.Color(parameters.insideColor);
            const colorOutside = new THREE.Color(parameters.outsideColor);

            for (let i = 0; i < parameters.count; i++) {
                // Generar posición en coordenadas polares
                const r = Math.pow(Math.random(), 1.5) * parameters.radius;
                
                // Ángulo base según el brazo
                const armAngle = (i % parameters.arms) * (Math.PI * 2 / parameters.arms);
                
                // Ángulo espiral: cuanto más lejos, más giro
                const spinAngle = r * parameters.spin;
                
                // Aleatoriedad para dar grosor a los brazos
                const randomAngle = (Math.random() - 0.5) * parameters.randomness * 2;
                const randomRadius = (Math.random() - 0.5) * 0.5;
                
                // Ángulo final
                const angle = armAngle + spinAngle + randomAngle;
                
                // Coordenadas cartesianas
                const x = Math.cos(angle) * (r + randomRadius);
                const z = Math.sin(angle) * (r + randomRadius);
                const y = (Math.random() - 0.5) * 1.5 * (r / 8); // Grosor vertical

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Color: mezcla entre interior y exterior
                const mixFactor = (r - parameters.coreRadius) / (parameters.radius - parameters.coreRadius);
                const clampedMix = Math.max(0, Math.min(1, mixFactor));
                
                const color = colorInside.clone().lerp(colorOutside, clampedMix);
                
                // Variación aleatoria
                color.multiplyScalar(0.8 + 0.4 * Math.random());

                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Crear textura circular para estrellas
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, 2 * Math.PI);
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 14);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.5, 'rgba(255,200,100,0.8)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);

            const material = new THREE.PointsMaterial({
                size: 0.2,
                map: texture,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });

            const galaxy = new THREE.Points(geometry, material);
            return galaxy;
        }

        const galaxy = createGalaxy();
        scene.add(galaxy);

        // --- Añadir algunas nebulosas (sprites) para ambiente ---
        function createNebulaTexture(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, `rgba(${color.r*255},${color.g*255},${color.b*255},0.6)`);
            grad.addColorStop(0.7, `rgba(${color.r*255},${color.g*255},${color.b*255},0.1)`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        for (let i = 0; i < 15; i++) {
            const hue = 0.7 + Math.random() * 0.3; // azul a morado
            const color = new THREE.Color().setHSL(hue, 0.8, 0.5);
            const material = new THREE.SpriteMaterial({
                map: createNebulaTexture(color),
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.3,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            
            // Posicionar alrededor de la galaxia
            const r = 8 + Math.random() * 10;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 5;
            
            sprite.position.set(
                Math.cos(angle) * r,
                height,
                Math.sin(angle) * r
            );
            
            sprite.scale.set(4 + Math.random()*4, 4 + Math.random()*4, 1);
            scene.add(sprite);
        }

        // --- CONTROL DE SCROLL (cámara se aleja y eleva) ---
        const startPos = new THREE.Vector3(5, 3, 15);
        const endPos = new THREE.Vector3(0, 12, 35);
        const targetPos = startPos.clone();

        const fondo = document.getElementById('fondo');

        window.addEventListener('scroll', () => {
            const progress = Math.min(1, window.scrollY / (document.body.scrollHeight - window.innerHeight));
            
            // Interpolar posición de cámara
            targetPos.x = startPos.x + (endPos.x - startPos.x) * progress;
            targetPos.y = startPos.y + (endPos.y - startPos.y) * progress;
            targetPos.z = startPos.z + (endPos.z - startPos.z) * progress;
            
            // Efecto en fondo
            if (fondo) {
                fondo.style.transform = `scale(${1 + progress * 0.3})`;
            }
        });

        // --- ANIMACIÓN ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.005;

            // Movimiento suave de cámara
            camera.position.lerp(targetPos, 0.05);
            camera.lookAt(0, 1, 0);

            // Rotación de la galaxia
            galaxy.rotation.y += 0.002;
            galaxy.rotation.x = 0.1; // ligera inclinación

            renderer.render(scene, camera);
        }

        animate();

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- CONTRASEÑA ---
        document.getElementById('btn1').addEventListener('click', (e) => {
            e.preventDefault();
            if (prompt('Contraseña:') === 'laura') {
                window.location.href = 'poemitas.html';
            } else {
                alert('Incorrecta');
            }
        });
    </script>
</body>
</html>
