<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nebulosa del Cangrejo · Prosa Estelar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: #000;
            color: #f0e6d0;
        }

        /* Fondo de nebulosa */
        #fondo-nebulosa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: url('https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5468.jpeg');
            background-size: cover;
            background-position: center;
            filter: brightness(0.65) contrast(1.2) saturate(1.1);
            transition: opacity 0.8s ease;
        }

        /* Título principal */
        .titulo-nebulosa {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }

        .titulo-nebulosa .cangrejo {
            font-size: 4.5rem;
            font-family: 'Wide Latin', 'Georgia', serif;
            color: #fff5e6;
            text-shadow: 0 0 25px #ffaa66, 0 0 45px #ff8844, 0 0 70px #cc66ff;
            letter-spacing: 4px;
            animation: brilloSuave 3s infinite alternate;
        }

        .titulo-nebulosa .subtitulo {
            font-size: 1.2rem;
            font-family: 'Georgia', serif;
            font-style: italic;
            color: #ffddbb;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
            margin-top: 12px;
            letter-spacing: 2px;
        }

        @keyframes brilloSuave {
            0% { text-shadow: 0 0 20px #ffaa66, 0 0 35px #ff8844; }
            100% { text-shadow: 0 0 40px #ffdd99, 0 0 65px #ffaa44, 0 0 90px #dd88ff; }
        }

        /* Columnas laterales de planetas */
        .planetas-columna {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 100;
            pointer-events: none;
        }
        .izquierda {
            left: max(20px, 3%);
        }
        .derecha {
            right: max(20px, 3%);
        }

        /* Estilo de cada planeta (3D realista con imagen) */
        .planeta-realista {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            background-size: cover;
            background-position: center;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6),
                        0 0 0 3px rgba(255, 235, 170, 0.3),
                        inset 0 0 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            filter: brightness(1.02) contrast(1.05);
        }
        .planeta-realista:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8), 0 0 0 4px rgba(255, 220, 100, 0.7);
            filter: brightness(1.1);
        }

        /* Pergamino (igual que antes) */
        .pergamino-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 85%;
            max-width: 700px;
            max-height: 75vh;
            background: rgba(15, 10, 20, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            border: 1px solid rgba(255, 215, 150, 0.6);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 0 2000px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 180, 70, 0.4);
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            padding: 30px 35px;
            overflow-y: auto;
            font-family: 'Georgia', serif;
            color: #fef3e2;
            text-shadow: 0 0 4px #00000066;
            pointer-events: auto;
        }
        .pergamino-modal.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .pergamino-modal h3 {
            font-size: 2rem;
            font-family: 'Wide Latin', 'Georgia', serif;
            margin-bottom: 20px;
            text-align: center;
            color: #ffddaa;
            border-bottom: 1px solid rgba(255, 220, 150, 0.5);
            display: inline-block;
            width: auto;
            padding-bottom: 8px;
            letter-spacing: 2px;
        }
        .pergamino-modal .poema-contenido {
            white-space: pre-line;
            line-height: 1.65;
            font-size: 1.1rem;
            margin-top: 15px;
            text-align: left;
            font-weight: 400;
            max-height: 55vh;
            overflow-y: auto;
            padding-right: 10px;
            user-select: text;
        }
        .pergamino-modal .cerrar-pergamino {
            position: absolute;
            top: 18px;
            right: 24px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #ffcc99;
            filter: drop-shadow(0 0 6px black);
            transition: 0.2s;
        }
        .pergamino-modal .cerrar-pergamino:hover {
            color: #ffaa66;
            transform: scale(1.1);
        }
        .poema-contenido::-webkit-scrollbar {
            width: 5px;
        }
        .poema-contenido::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        .poema-contenido::-webkit-scrollbar-thumb {
            background: #ffc285;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .titulo-nebulosa .cangrejo {
                font-size: 2.4rem;
                white-space: normal;
                padding: 0 15px;
            }
            .titulo-nebulosa {
                top: 14%;
                white-space: normal;
                width: 90%;
            }
            .planetas-columna {
                gap: 1.2rem;
            }
            .planeta-realista {
                width: 75px;
                height: 75px;
            }
            .izquierda {
                left: 10px;
            }
            .derecha {
                right: 10px;
            }
            .pergamino-modal {
                width: 90%;
                padding: 20px;
            }
            .pergamino-modal h3 {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 600px) {
            .planeta-realista {
                width: 60px;
                height: 60px;
            }
            .planetas-columna {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="fondo-nebulosa"></div>

    <div class="titulo-nebulosa">
        <div class="cangrejo">NEBULOSA DEL CANGREJO</div>
        <div class="subtitulo">⋆⁺₊☾ Fragmentos de luz escritos ☽₊⁺⋆</div>
    </div>

    <!-- Columnas laterales para los planetas -->
    <div class="planetas-columna izquierda" id="planetasIzq"></div>
    <div class="planetas-columna derecha" id="planetasDer"></div>

    <!-- Pergamino modal -->
    <div id="pergamino" class="pergamino-modal">
        <button class="cerrar-pergamino" id="cerrarPergamino">&times;</button>
        <h3 id="tituloPoema">Título</h3>
        <div id="contenidoPoema" class="poema-contenido"></div>
    </div>

    <script>
        // ---------- POEMAS (los mismos 8) ----------
        const poemas = [
            {
                titulo: "Manos Abiertas",
                texto: `Allí estabas, después del humo y las cenizas, de los gritos y los adioses, del abismo; después del fondo, estabas allí. Como si nunca te hubieras marchado, sin añoranzas ni remordimientos, sin desviar la mirada, con la frente erguida y las… ¡las cicatrices en tus manos abiertas!

Era yo el fugitivo; me había alejado y otra vez venías a mi encuentro. Con solo un beso sedujiste mi escamoso corazón. Lo cautivaste con uno de esos: “sígueme”, “no temas”, “solo confía”. Al instante, la ansiedad, el miedo y la confusión, leales compañeros de por vida, sin avisar se marcharían. Acariciaste las arrugas, favoreciste al despreciado, reivindicaste al caído. Traspasaste el cielo, fuiste traspasado, traspasaste la muerte para traspasarme a la vida, y ahora puedo pasar un rato contigo; un rato como una eternidad, como un mundo de gentes traspasadas por tu amor, sin arrugas, manchas o impurezas, sin retazos de pecado ni secuelas de lo caído, sin nada más que tu presencia.

Fue como gotas de lluvia acabadas de caer, como grato rocío sobre mis hombros. Gracias por tanto, no quiero que termine; fluye sobre mí y desplázame a tu corazón, para correr entre aguaceros, sin paraguas ni itinerarios, correr a campo abierto. Qué éxtasis de calma y placentera quietud donde me llevas; nunca sabría llegar hasta aquí. Fueron tus manos abiertas en mis espaldas corrigiéndome, tu mirada… tu mirada, redarguyendo mi sequía con la ternura del rocío.

Y aunque me encuentre debajo del cielo —donde el azul se destiñe y prevalecen las rocas, donde miles de secretos resuenan en mi orilla—, aun así voy a tu encuentro; me lanzo hacia ti y recaigo en tus lomos. Tienes tanto que darme; aquí estaré. Que nadie despierte a esta alma escondida; aquí soy y seré. Porque llegará ese día en que el cielo será mi suelo —cuando el azul retome su carácter y las rocas desistan de su dureza, cuando los misterios emerjan a Su verdad—; entonces aquí seguiré, mucho más cerca, más profundo y sublime, contigo, más vivo que nunca: la muerte me habrá despertado.

Mientras tanto camino este sendero angosto, marcado con la sangre de un cordero, con recodos anegados en lágrimas que apagan los infiernos, con canciones de redención que pronuncian mi nombre. Mientras tanto mis miedos persisten, en ser intimidados por tu amor. Mientras tanto puedo mirar más allá al cerrar mis ojos, en oración. Mientras tanto tus Palabras hacen su hogar en mi corazón y lo esculpen al ritmo de salmos. Mientras tanto tus manos abiertas me sostienen y me llevan a ese lugar donde no habrá más cenizas, gritos o abismos; no habrá más cicatrices que las que ahora me enseñas, en tus manos abiertas.`
            },
            {
                titulo: "Súper Mario",
                texto: `No estoy en contra de los videojuegos, pero desde niño siempre supe que jugar Súper Mario no era más súper que jugar con Mario. Aquellos juegos, que de ser enseñados a los adultos harían la vida más profunda y menos abismal, más seria y menos aburrida, más fantástica y menos fantasiosa, harían la vida más viva y menos muerta, más súper y más, y mucho más.

Jugar Súper Mario no era más súper que jugar con Mario. Aquellos juegos, cara a cara, hombro a hombro, corazón a corazón. Juegos que trascienden a las pantallas, al régimen de los espejos negros. No culpemos a los espejos; ellos tan solo muestran reflejos del que asoma su semblante. Aunque, ¿por qué mirarnos de forma constante, cuando tenemos por delante un universo deslumbrante? Horizontes majestuosos que sobrepasan nuestra gloria y a nuestros ojos fascinan; sin reclamarlo, nunca cobran. ¡Tinieblas! Endeudas a los hombres y te pagan con su vida; te adueñas de su identidad y, a cambio, los motivas a buscarla en los espejos por el resto de sus días. Faena insaciable, verdades con mentiras, vanidad de vanidades que al jugar evitarían.

Jugar Súper Mario no era más súper que jugar con Mario. Aquellos juegos, pasatiempos en los que el Tiempo no pasaba: a contemplarnos se recostaba, suspiraba conmovido y en su destino meditaba. En cierta ocasión volvió hacia mí su mirada y con sus ojos quebrados la tragedia me anunciaba: llegaría la hora, y ya se acercaba, cuando nuestros juegos a un final arribaran, cuando uno de los dos por siempre faltara. ¡Tinieblas! ¡Tinieblas! ¿Quién desea tu llegada?

Jugamos al “veo, veo” en medio de un apagón; allí no se puede ver nada y abunda la confusión. Mas esas fueron las horas más claras para los ojos del corazón. No todos pueden jugar este juego; requiere una súper visión para mirar más allá de tu ego, requiere un súper corazón. No estoy en contra de los videojuegos, pero desde niño siempre supe que jugar Súper Mario no era más súper que jugar con Mario, mi amado abuelo.`
            },
            {
                titulo: "Fragmentos de Inocencia",
                texto: `Tu inocencia convive entre los abrazos. Tu inocencia pregunta sin reparos, obedece con entusiasmo, se asombra sin ver milagros, encuentra una supernova en la piñata de su cumpleaños, descubre un firmamento en la palma de su mano y presta atención a los cuentos como si fueran un gran invento, un gran misterio revelado.

Érase una vez la inocencia, con el ombligo sucio y su limpia conciencia, con pantalones holgados que con amor adoptaron una pequeña mancha de helado, en un asiento del parque donde la habían abandonado. Menuda algarabía si su padre se hubiera enterado, pero por suerte traía sus bolsillos abarrotados con masa de plastilina que en la escuela se había robado. Taparle los huecos podría; los huecos tenebrosos e hinchados, los huecos que se cerraban y abrían, de la nariz de su padre enojado. Lejos de casa se iría y, por supuesto, llevaría sus pantalones holgados, pedazos de cielo en la mano y a su pequeña mancha de helado.

Pero aquí no termina la historia, porque la inocencia es una mente inédita, un nuevo mundo con su virgen cosmovisión que apenas comienza a ser colonizado por la civilización, o quizás por las tendencias de un influencer anciano, un almirante adiestrado en los océanos del corazón: la experiencia… (Pero aun así, mi experiencia solo sigue siendo un fragmento de tu inocencia).`
            },
            {
                titulo: "Fragmentos de Experiencia",
                texto: `Mi experiencia es tan longeva como mis dudas, saturada de nuevos comienzos y disculpas. Tengo experiencia suficiente para conocer mi ignorancia y de mi inconsciencia estar siempre consciente. Lo que muchos llaman “experiencia personal”, frecuentemente se construye con inexperiencias ajenas, y se confunde la obstinación con la perseverancia, la terquedad con la resolución, las arrugas con la experiencia.

Aunque, ciertamente, la experiencia está hecha de papeles arrugados, cestos llenos de bolas de papel que conservamos como recordatorio de nuestra inexperiencia. Allí vamos con frecuencia a desarrugar algunos y darnos cuenta de que nunca debieron estar allí, y darnos cuenta de que nos falta experiencia, incluso, para ver las diferencias entre los papeles de la basura y las páginas de la vida.`
            },
            {
                titulo: "Esa Luz Incorregible",
                texto: `Cuando abrí por primera vez los ojos, la Luz me enfocó. Pero no fue esa luz cegadora del mediodía, cuando intentas mirar el sol y tus ojos se lastiman; era una Luz cautivadora, agradable, fascinante, perfecta, pura, idónea, incorregible. No exagero al decir que el sol, en sus jornadas de mayor intolerancia, luciría sombrío ante aquella Luz que traía tanto placer a mis ojos. Este solo sería el primer vistazo de una realidad saturada de Luz por descubrir en lo adelante.

Todo a mi alrededor la reflejaba; era omnipresente sin ser repetitiva, sublime pero nunca impersonal; era autosuficiente sin ser arrogante, inmejorable mas no monótona, sobrenatural pero no irracional; era una luz inescrutable pero conocible, cercana pero no manejable...

Con cada paso que daba, nuevas dimensiones de la Luz golpeaban mi frente y se abrían paso ante mis ojos. Así que simplemente empecé a caminar y caminar, y los nuevos paisajes de Luz me impregnaban de asombro y confianza. Sí, confianza. A pesar de estar totalmente desnudo en plena Luz, mi estado de íntima confidencialidad y dependencia con la Luz guardaban mi conciencia de abundante paz y seguridad. No había nada que esconder. Así que a los pocos vistazos ya estaba corriendo entre los bosques iluminados, explorando valles de Luz, nadando en lagos de Luz, escalando montañas de Luz...

Abría mis ojos, disfrutando de la Luz. Pero sorprendentemente, en la noche, cuando los cerraba, en el silencio, en la tranquilidad, el sueño, en el oscuro revés de mis párpados, la Luz persistía; nunca me abandonaba.

La Luz me sobrecogía; también estaba en mí. Por un instante pensé que yo era su causa, eso explicaría su constante presencia, pero realmente era una idea absurda. La Luz me sobrepasaba por mucho, tenía un origen mucho más sublime y supremo, apuntaba a algo o alguien más grandioso; todo lo que fulgía luz, incluyéndome a mí mismo, sería solo un reflejo de eso grandioso. La Luz hablaba, daba testimonio y me invitaba a mirar a través de ella, hacia la fuente de Luz… entonces fue cuando percibí que era Su Luz.`
            },
            {
                titulo: "Mandarina",
                texto: `Al atardecer, a la luz del crepúsculo, cuando el moribundo sol se deja contemplar sin que lastime los ojos, allí, opaco, es más bello que nunca. El imponente astro se torna accesible, vulnerable, cortés. Muchos creen que el atardecer es solo un acto de abnegación del sol para que podamos apreciarlo, y es que Él tiene la certeza de ser la mejor vista que jamás podremos tener. Sirviéndonos sin ser nuestro siervo (Mr. 10:45), se muestra condescendiente, inclina su semblante y ensombrece su enardecido rostro. Su fulgor mandarina dibuja mi sonrisa, al atardecer. (Mal. 4:2).`
            },
            {
                titulo: "Simeón",
                texto: `Es Él.
Lo sabía.
La hora ha llegado:
ese instante cargado de siglos
y generaciones a la expectativa.

Todas las cosas se reúnen en Él.
Todos los misterios se descubren en esta verdad.
Espacio y tiempo existen
para confesar que no pueden contenerlo.

Y aquí estoy,
nada menos que yo.
¿Quién soy yo?

Lo tengo frente a mis ojos.
Su mano pequeña aprieta mi meñique.
Descansa en mis brazos,
aunque sé que es Él quien me sostiene.

Cargo un bebé inocente
y, sin embargo, es la Sabiduría encarnada.
Parece frágil y vulnerable,
pero es el Dios Fuerte.
Nada extraordinario se percibe en su presencia,
y aun así,
Él es el que es.
Nadie más posee ese nombre...

—¿Cuál es su nombre? —pregunto a su madre.

Sin dudar, responde:

—Su nombre es Jesús.`
            },
            {
                titulo: "Llegada al cielo",
                texto: `—¡Guau! ¡Sí! ¡Esto sí es! ¡Ahora sí! ¡Aquí estoy! ¡Aleluya! ¡He llegado! Aquí estoy…
—¿Eres tú?
—¡Eres Tú, Señor, mi Señor! ¡Te amo!
—¡Gracias! No soy digno; ¡Tú lo eres! ¡Solo Tú lo eres!
—¡Eres hermoso! ¡Magnífico! ¡Te adoro! ¡Gracias! ¡Gracias!
—No tengo palabras, pero Tú las conoces; te he negado muchas veces, pero tu gracia me ha rescatado. Solo es por ti que estoy aquí, no lo merezco; ahora lo sé más que nunca. Seas adorado, Dios, te amo, te serviré por la eternidad. ¡Qué deleite!
—¡Aleluya! ¡Tú eres digno! ¡Eres el Rey! ¡Soberano! ¡El vencedor! ¡Solo Tú!

—Ven, hijo mío… quiero abrazarte.`
            }
        ];

        // URLs de las imágenes de los planetas (en orden: izquierda 4, derecha 4)
        // Ajusta las URLs según tu repositorio (ya están en raw.githubusercontent.com)
        const imagenesIzq = [
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5606.jpeg",
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5607.jpeg",
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5603.jpeg",
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5604.jpeg"
        ];
        const imagenesDer = [
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5614.jpeg",
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5615.jpeg",
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5618.jpeg",
            "https://raw.githubusercontent.com/socram98gg-cpu/poemas/main/IMG_5620.jpeg"
        ];

        // Crear planetas en las columnas
        const contenedorIzq = document.getElementById('planetasIzq');
        const contenedorDer = document.getElementById('planetasDer');

        function crearPlanetas() {
            contenedorIzq.innerHTML = '';
            contenedorDer.innerHTML = '';

            // Izquierda: primeros 4 poemas (índices 0-3)
            for (let i = 0; i < 4; i++) {
                const planeta = document.createElement('div');
                planeta.className = 'planeta-realista';
                planeta.style.backgroundImage = `url('${imagenesIzq[i]}')`;
                planeta.addEventListener('click', (function(idx) {
                    return function() { mostrarPoema(idx); };
                })(i));
                contenedorIzq.appendChild(planeta);
            }

            // Derecha: últimos 4 poemas (índices 4-7)
            for (let i = 4; i < 8; i++) {
                const planeta = document.createElement('div');
                planeta.className = 'planeta-realista';
                planeta.style.backgroundImage = `url('${imagenesDer[i-4]}')`;
                planeta.addEventListener('click', (function(idx) {
                    return function() { mostrarPoema(idx); };
                })(i));
                contenedorDer.appendChild(planeta);
            }
        }

        // Pergamino (mismo de antes)
        const pergamino = document.getElementById('pergamino');
        const tituloElem = document.getElementById('tituloPoema');
        const contenidoElem = document.getElementById('contenidoPoema');
        const cerrarBtn = document.getElementById('cerrarPergamino');

        function mostrarPoema(indice) {
            tituloElem.textContent = poemas[indice].titulo;
            contenidoElem.textContent = poemas[indice].texto;
            pergamino.classList.add('active');
        }

        function cerrarPergamino() {
            pergamino.classList.remove('active');
        }

        cerrarBtn.addEventListener('click', cerrarPergamino);
        window.addEventListener('click', (e) => {
            if (pergamino.classList.contains('active') &&
                !pergamino.contains(e.target) &&
                !e.target.classList.contains('planeta-realista')) {
                cerrarPergamino();
            }
        });

        // Inicializar
        crearPlanetas();
        console.log('🌌 Nebulosa del Cangrejo activa — 8 planetas realistas laterales');
    </script>
</body>
</html>
